apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: eks-arm64-platform
spec:
  role: KarpenterNodeRole-eks-arm64-platform

  amiSelectorTerms: #Ami image id 
    - alias: al2023@latest

  subnetSelectorTerms:  # subnet id mentioned
    - tags:
        karpenter.sh/discovery: eks-arm64-platform

  securityGroupSelectorTerms:  # security group id mentioned
    - tags:
        karpenter.sh/discovery: eks-arm64-platform

  blockDeviceMappings:   # block device mapping for the node
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  metadataOptions:   #configure the instance  details
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  detailedMonitoring: false # get the data from cloudwatch for the node monitoring

  tags:
    Project: eks-arm64-platform-automation
    Environment: learning
    ManagedBy: Karpenter
